<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` so `env(safe-area-inset-*)` reports anything at
         all: without it the insets are zero and the thumbs rest on the home
         indicator, where the first push upward is taken by the system. -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Abyss</title>
    <meta name="description" content="WoW 클라이언트에서 읽어낸 엘윈 숲을, 우리 것인 그림으로 그린다." />
    <meta name="theme-color" content="#93b6cf" />
    <style>
      /*
        Korean first in both stacks.  A Latin-first stack is not wrong so much
        as invisible: the browser falls through to whatever it has for Hangul,
        which on Linux is whichever one was installed first.
      */
      :root {
        --mono: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR',
          ui-monospace, monospace;
        --body: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR',
          system-ui, sans-serif;
        /*
          What the client states, filled in at load by `spell` in
          `src/hud.ts` out of `layout.json`.  The values here are the
          fallbacks for a page with no bake behind it, and they are the ones
          that were hand-picked: the rage bar was `#a32d22` where `FrameXML`
          says (1, 0, 0) and the experience bar `#5b3fa8` where it says
          (0.58, 0, 0.55).  A number tuned by hand twice is a number that
          should be derived, and this file had 229 of them.
        */
        --rage: #a32d22;
        --mana: #2f4fa8;
        --energy: #c9b23a;
        --xp: #5b3fa8;
        --xp-rested: #1f5fa0;
        --font-tiny: 10px;
        --font-small: 11px;
        --font-med: 12px;
        --font-large: 13px;
        --shadow: 1px 1px 0 #000;
      }
      html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden; }
      /*
        Pixels stay pixels.

        The world canvas is sized in **CSS pixels** — `canvas.width =
        floor(innerWidth)` — and that is a decision rather than an oversight:
        a phone then draws 390 x 844 where a desktop draws 1280 x 800, a third
        of the work, and a 32-pixel LPC tile stays 32 pixels instead of
        shrinking to a third of a thumbnail.  The cost is that the browser
        scales the result up by the device ratio to composite it, and *how* it
        scales is this line.  Left at the default a phone at dpr 2 or 3 blurs
        every tile in the game, and a desktop at dpr 1 shows nothing wrong
        because there is no scaling to do.

        `ctx.imageSmoothingEnabled = false` does not cover this: that governs
        `drawImage` *inside* the canvas, not the composite outside it.
      */
      canvas { display: block; touch-action: none; }
      /*
        And only where there is a scale to control.  At dpr 1 the canvas is
        composited one to one, so `pixelated` changes nothing about the
        picture — and it changes a great deal about the cost: measured on this
        machine it took the widest zoom from 52 frames a second to 31, because
        asking for nearest-neighbour compositing drops the fast path.  A
        setting that buys nothing and costs a third of the frame rate does not
        belong on every screen.
      */
      @media (min-resolution: 1.5dppx), (-webkit-min-device-pixel-ratio: 1.5) {
        canvas { image-rendering: pixelated; }
      }
      html { overscroll-behavior: none; }
      /*
        The readout is a grid, not padded text: a Korean glyph is two columns
        wide where a Latin one is one, and the font a phone falls back to for
        Korean is not monospace at all, so nothing lines up by counting spaces.
      */
      #hud {
        position: fixed; left: 8px; top: 8px; color: #cfe;
        font: var(--font-med)/1.5 var(--mono); background: rgba(0,0,0,.55); padding: 8px 10px;
        white-space: pre; pointer-events: none;
        display: grid; grid-template-columns: max-content auto; gap: 0 14px;
      }
      #hud .k { color: #8aa8bb; }
      #hud.plain { display: block; }
      /* The keys.  The original has no such line — it teaches with tooltips —
         so this one has no place to copy and takes the corner nothing else
         wants: left of the action bar, under the chat log. */
      #help {
        /* Under the panels.  It had no `z-index`, so being a sibling of `#ui`
           later in the document it painted **over** every window in the game:
           the key hints ran straight across the middle of the character sheet
           and of the shop. */
        position: fixed; z-index: 1;
        left: 10px; bottom: 8px; color: #9ab; font: var(--font-small)/1.6 var(--mono);
        background: rgba(0,0,0,.55); padding: 6px 8px; white-space: pre; pointer-events: none;
      }
      /*
        The interface, and it is meant to look like the one it is modelled on.

        None of that game's art is here — its textures are Blizzard's — so the
        look is rebuilt out of the three things it is actually made of: a warm
        gold edge, a dark parchment ground, and a bevel that says a thing is a
        button.  Circles where it uses circles, because the round minimap and
        the round portrait are most of what makes a screenshot of it
        recognisable at a glance.
      */
      #ui {
        --gold: #c8aa6e;
        --gold-dark: #6d5a37;
        --panel: rgba(10,9,12,.88);
        --ink: #f0e6d2;
      }
      /* Nothing in here takes a click: the interface reports, and the world
         underneath it is what answers a finger. */
      #ui, #ui * { pointer-events: none; }
      /* Except the things that are controls rather than reports.  Written with
         the id in front of them because `#ui *` is more specific than a bare
         selector and quietly won: the slots were set to `auto` and computed to
         `none`. */
      /* `#shop li` and `#shop .page` because a shop is pressed, and `#map` on
         a phone because that is where the five buttons come out of.  Every
         child of `#ui` is inert by default — the interface is a layer over a
         game and a click belongs to the game — so anything that answers a
         press has to say so here. */
      #ui .slot, #ui #bag li, #ui #micro button, #ui .auras .aura,
      #ui #shop li, #ui #shop .page {
        pointer-events: auto; cursor: pointer;
      }
      /* And the two screens that come **instead of** the game rather than
         over it.  Everything on them is a control — there is no world
         underneath to answer a click — so the whole subtree takes one.
         Without this every button on the screen that makes a character
         computed `pointer-events: none` and could not be pressed by a finger
         or a mouse at all, for as long as that screen has existed. The check
         that was supposed to cover it called `.click()` from script, which
         does no hit testing: *a check that reads the same side as the bug is
         blind to it*, which is this repository's own line. It clicks for real
         now. */
      #ui #create, #ui #create *, #ui #pick, #ui #pick * {
        pointer-events: auto;
      }
      /* Above the canvas, said out loud.  Both are painted in the positioned
         layer and the canvas is the later sibling, so without this the
         controls that take a click were behind the world. */
      #ui { position: fixed; inset: 0; color: var(--ink); z-index: 2; }
      #units { position: absolute; left: 12px; top: 12px; width: 244px; }

      .frame {
        display: grid; grid-template-columns: 46px 1fr; gap: 9px;
        align-items: center;
        background: var(--panel); border: 1px solid var(--gold-dark);
        border-radius: 4px; padding: 5px 8px 5px 5px; margin-bottom: 5px;
        box-shadow: inset 0 0 0 1px #000, 0 1px 3px rgba(0,0,0,.6);
      }
      .frame[hidden] { display: none; }
      /* Round, and ringed.  A square portrait is the single thing that stops a
         frame reading as that game's frame. */
      .frame .face {
        width: 46px; height: 46px; border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, #2a2622, #100e0c);
        border: 2px solid var(--gold-dark); box-shadow: 0 0 0 1px #000;
        box-sizing: border-box; opacity: .95;
        overflow: hidden; display: grid; place-items: center;
      }
      /* An icon is a symbol and wants air round it; a portrait is a face and
         wants the whole circle, the way the client's 64 by 64 does. */
      .frame .face img { width: 34px; height: 34px; }
      .frame .face canvas { width: 46px; height: 46px; image-rendering: pixelated; }
      .frame .top {
        display: flex; justify-content: space-between; align-items: baseline;
        font: var(--font-med)/1.3 var(--body);
      }
      .frame .name { color: var(--ink); letter-spacing: .01em; }
      /* The level sits in its own little box in the corner, as it does there. */
      .frame .lv {
        color: var(--gold); font: var(--font-tiny)/1.4 var(--mono);
        background: #000; border: 1px solid var(--gold-dark);
        border-radius: 2px; padding: 0 4px;
      }
      .frame .bar, #ui #xp, #ui .rage {
        position: relative; height: 14px; margin-top: 4px;
        background: #000; border: 1px solid #2a2520; border-radius: 2px;
        overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.9);
      }
      .frame .fill, #ui #xp .fill, #ui .rage .fill {
        position: absolute; inset: 0 auto 0 0; width: 0;
        transition: width .12s linear;
        box-shadow: inset 0 5px 6px rgba(255,255,255,.16);
      }
      .frame .num, #ui #xp .num, #ui .rage .num {
        position: relative; display: block; text-align: center;
        font: var(--font-tiny)/14px var(--mono); color: #fff;
        text-shadow: 0 1px 2px #000, 0 0 2px #000;
      }
      #ui .rage { height: 10px; }
      #ui .rage .fill { background: var(--rage); }
      #ui .rage .num { font-size: 9px; line-height: 10px; color: #ffd9d0; }
      /* The experience bar goes across the bottom, on the action bar's top
         edge, because that is where `MainMenuExpBar` is: 1024 by 13 anchored
         to `MainMenuBar`'s TOP.  `pipeline/layout.py` supplies the anchor and
         the size; what is here is only how it looks. */
      #ui #xp { height: 13px; margin: 0; z-index: 3; }
      #ui #xp .fill { background: var(--xp); }
      #ui #xp .num { font-size: 9px; line-height: 13px; color: #ded4f2; }

      /* The swing, which is the only timer there is — and the original's cast
         bar is 195 by 13 sitting 55 above the bottom edge, which is where the
         layout puts this. */
      #ui #swing {
        height: 13px; background: #000; border: 1px solid #2a2520;
        border-radius: 2px; overflow: hidden; z-index: 3;
      }
      #ui #swing .fill { height: 100%; width: 0; background: var(--gold); }
      /* And the word, for a cast — the swing has nothing to say. */
      #ui #swing .num {
        position: absolute; inset: 0; text-align: center;
        font: var(--font-tiny)/13px var(--body); color: #e8e4d8;
        text-shadow: var(--shadow); pointer-events: none;
      }
      #ui #swing { position: relative; }

      /* A rogue's combo points, under the portrait beside the power bar. */
      #ui .combo { display: flex; gap: 2px; margin-top: 2px; }
      #ui .combo .pip {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--energy); box-shadow: 0 0 0 1px #000;
      }
      #ui .combo[hidden] { display: none; }

      /* What you are in the middle of, under the minimap. */
      #track {
        width: 190px; color: #e8e4d8; font: var(--font-small)/1.6 var(--body);
        text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      #track .title {
        color: var(--gold); font: var(--font-small)/1.6 var(--mono); letter-spacing: .04em;
        margin-bottom: 2px;
      }
      #track .job { margin-bottom: 6px; }
      #track .job.done .line { color: #8fd08a; }
      #track .line::before { content: '· '; color: #6f8ea6; }
      #track .line.got { color: #8fd08a; }

      #ui .auras { display: flex; gap: 3px; margin: 4px 0 0; }
      #ui .auras .aura {
        position: relative; width: 22px; height: 22px; border-radius: 3px;
        background: var(--panel); border: 1px solid var(--gold-dark);
      }
      #ui .auras .aura img { width: 100%; height: 100%; }
      #ui .auras .aura span {
        position: absolute; right: 1px; bottom: 0;
        font: 9px var(--mono); color: var(--gold); text-shadow: 0 1px 2px #000;
      }
      #ui .oftarget {
        margin: 2px 0 2px 55px; font: var(--font-tiny)/1.5 var(--mono); color: #9aa6ae;
      }
      #ui .oftarget[hidden] { display: none; }

      /* Round, with a ring, and the zone above it — which is the corner that
         game is most recognisable by. */
      #map {
        position: absolute; right: 14px; top: 14px; width: 156px;
        text-align: center;
      }
      #map canvas {
        display: block; width: 150px; height: 150px; border-radius: 50%;
        image-rendering: pixelated;
        border: 3px solid var(--gold-dark);
        box-shadow: 0 0 0 1px #000, inset 0 0 0 1px #000, 0 2px 6px rgba(0,0,0,.7);
      }
      /* On a plate, not on the grass.  Gold text over a lit field is gold
         text nobody can read. */
      #map .where, #map .clock {
        font: var(--font-tiny)/1.6 var(--mono); color: var(--gold);
        background: var(--panel); border: 1px solid var(--gold-dark);
        border-top: 0; margin: 0 14px;
      }
      #map .where { border-radius: 0 0 3px 3px; margin-top: -2px; }
      #map .clock { color: #9aa6ae; border-radius: 3px; margin-top: 3px;
        border-top: 1px solid var(--gold-dark); }

      /* What just happened, newest last. */
      /* A box things scroll through, bottom-aligned inside it so the newest
         line is always at the same place.  Its size is the original's. */
      #log {
        position: absolute; left: 12px; bottom: 14px; width: 320px;
        display: flex; flex-direction: column; justify-content: flex-end;
        overflow: hidden;
        font: var(--font-small)/1.6 var(--body); text-shadow: 0 1px 2px #000;
      }
      #log div { color: #b9c4cc; }
      #log .hit { color: #ffe9a8; }
      #log .hurt { color: #ff9d8c; }
      #log .gain { color: #a9e39a; }

      /* Every panel is the same panel: parchment dark, gold edge, a title rule. */
      #sheet, #bag, #world, #tip, #shop, #book {
        background: var(--panel); border: 1px solid var(--gold-dark);
        border-radius: 4px; color: var(--ink);
        box-shadow: inset 0 0 0 1px #000, 0 3px 10px rgba(0,0,0,.6);
      }
      #book[hidden],
      #sheet[hidden], #bag[hidden], #world[hidden], #tip[hidden],
      #shop[hidden] { display: none; }
      #sheet .title, #bag .title, #world .title, #shop .title, #book .title {
        color: var(--gold); font: var(--font-small)/1.8 var(--mono); letter-spacing: .04em;
        border-bottom: 1px solid var(--gold-dark);
        padding-bottom: 4px; margin-bottom: 5px; text-align: center;
      }

      #sheet {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        min-width: 240px; padding: 10px 16px; font: var(--font-med)/1.9 var(--body);
        /* So the cap `setSheet` measures is the cap: under the default
           `content-box` the ten of padding either side and the border made
           the panel twenty-two pixels taller than it was told to be, which is
           exactly the overlap `uicheck` saw. */
        box-sizing: border-box;
      }
      #sheet .row { display: flex; justify-content: space-between; gap: 24px; }
      /* The thirteen squares of what he is wearing — see `setSheet`. */
      /*
        Fixed squares rather than `repeat(7, 1fr)` with `aspect-ratio`.  The
        panel is `overflow: auto` under a `max-height`, and a row whose height
        is only known after the columns are sized resolves too late to be
        clipped by it — the second row drew ninety pixels below the panel's own
        border.  A square that knows how big it is does not have that problem.
      */
      /* Two columns with the man between them, which is what the original
         does and what `PaperDollFrame.xml` states: head at the top of the
         left, feet at the bottom of the right, weapons along the bottom.
         A grid in reading order was a spreadsheet of what you own. */
      #sheet .body {
        display: flex; align-items: flex-start; justify-content: center;
        gap: 8px; margin-top: 8px;
      }
      #sheet .figure {
        flex: 1 1 auto; min-width: 56px; min-height: 116px;
        display: flex; align-items: center; justify-content: center;
      }
      #sheet .figure canvas { image-rendering: pixelated; }
      #sheet .worn { display: flex; flex-direction: column; gap: 4px; }
      #sheet .worn.bottom {
        flex-direction: row; justify-content: center; margin-top: 6px;
      }
      #sheet .worn .square {
        display: flex; align-items: center; justify-content: center;
        width: 34px; height: 34px;
        border: 1px solid #3a3a33; border-radius: 3px;
        background: rgba(0,0,0,.3);
      }
      #sheet .worn .square.bare { opacity: .3; }
      #sheet .worn .pic { width: 74%; height: 74%; margin: 0; }
      #sheet .k { color: #9aa6ae; }

      #tip {
        position: absolute; max-width: 240px; padding: 6px 9px;
        font: var(--font-small)/1.6 var(--body); white-space: pre-line;
        transform: translate(-50%, -100%);
      }

      #bag {
        position: absolute; right: 12px; bottom: 70px; width: 196px;
        padding: 8px 11px; font: var(--font-med)/1.8 var(--body);
      }
      #bag ul { margin: 0; padding: 0; list-style: none; }
      #bag li { display: flex; justify-content: space-between; }
      #bag li:hover { color: var(--gold); }
      #bag li.empty { color: #6b6658; justify-content: center; }
      #bag .many { color: #9aa6ae; font: var(--font-small) var(--mono); }

      /* The map of the whole forest.  Its own aspect, not a square. */
      /* The map dims what is behind it, because a map you can see the world
         through is two pictures at once. */
      #world::before {
        content: ''; position: fixed; inset: 0; background: rgba(0,0,0,.55);
        z-index: -1;
      }
      #world {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%); padding: 10px 12px 8px;
      }
      /* Whichever of the two runs out first.  Sized by height alone the
         forest is 1.4 times as wide as it is tall, which on a phone is half
         the map off the side of the phone. */
      #world canvas {
        display: block; image-rendering: pixelated; border: 1px solid #000;
        height: min(74vh, 700px); width: auto;
        max-width: calc(100vw - 48px); object-fit: contain;
      }
      #world .foot {
        text-align: center; font: var(--font-tiny)/1.9 var(--mono); color: #9aa6ae;
      }
      #world .pin {
        position: absolute; width: 9px; height: 9px; margin: -4px 0 0 -4px;
        border-radius: 50%; background: #fff;
        box-shadow: 0 0 0 2px #000, 0 0 6px 2px rgba(255,255,255,.5);
      }

      /* Twelve, always, and most of them empty. */
      /* High enough that the labels under the squares clear the help line,
         which lives on the floor of the same corner. */
      /* One assembly at the bottom, buttons then bags, the way the original's
         single bar frame holds both. */
      #deck { position: fixed; display: flex; align-items: flex-end; gap: 8px; }
      #deck > * { flex: none; }
      /*
        Two rows of eight, not one row of sixteen.

        The book holds seventeen abilities and a warrior who has bought
        everything carries fifteen, so the bar outgrew one row: at 960 wide it
        came to 1,040 pixels and hung forty off either end of the glass.  The
        original stacks its bars rather than lengthening one, and a fixed
        eight-wide grid has the property a growing row does not — the squares
        stay where they were when you learn something.
      */
      #bar {
        display: grid; grid-template-columns: repeat(8, 44px);
        /* 44 for the square and 15 for the word under it.  The label is
           positioned `bottom: -15px`, outside its square, so a grid row of 44
           put the top row's words on top of the bottom row's squares and the
           bottom row's words below the glass. */
        grid-auto-rows: 59px; gap: 4px 4px;
        align-items: start;
      }
      .slot {
        position: relative; width: 44px; height: 44px; border-radius: 3px;
        background: linear-gradient(#2a2622, #14120f);
        border: 1px solid var(--gold-dark);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 1px 3px rgba(0,0,0,.7);
      }
      .slot.bare {
        background: linear-gradient(#1a1815, #0d0c0a); border-color: #3a352c;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      }
      .slot.bare .key { color: #5f5a4e; }
      /* Not on the slot: `overflow: hidden` there clipped the label off the
         bottom, which is where a label under a square lives. */
      .slot img, .slot .sweep { position: absolute; inset: 0; }
      .slot img { width: 100%; height: 100%; opacity: .3; padding: 2px;
        box-sizing: border-box; }
      .slot.live img { opacity: 1; }
      /* The swing, drawn as a shutter that falls rather than a number. */
      .slot .sweep {
        position: absolute; inset: 0; background: rgba(0,0,0,.62);
        transform-origin: top; transform: scaleY(0);
      }
      .slot .key {
        position: absolute; left: 3px; top: 1px;
        font: var(--font-tiny) var(--mono); color: var(--gold); text-shadow: 0 1px 2px #000;
      }
      .slot .name {
        position: absolute; left: 0; right: 0; bottom: -15px; text-align: center;
        font: var(--font-tiny) var(--body); color: #9aa6ae; text-shadow: 0 1px 2px #000;
      }

      /* What opens, as opposed to what you do. */
      #micro { display: flex; gap: 4px; padding-bottom: 9px; }
      #micro button {
        font: var(--font-small) var(--body); color: #9aa6ae;
        background: linear-gradient(#2a2622, #14120f);
        border: 1px solid var(--gold-dark); border-radius: 3px;
        padding: 5px 10px; cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      }
      #micro button:hover { color: var(--ink); }
      #micro button.on { color: var(--gold); border-color: var(--gold); }

      /* The readout is a developer's, so it goes where one belongs and starts
         out of the way.  ` shows it. */
      #hud { left: auto; right: 8px; }
      #hud[hidden] { display: none; }

      #talk {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        width: min(620px, calc(100vw - 32px)); color: #e8e4d8;
        font: var(--font-large)/1.75 var(--body);
        background: rgba(12,14,20,.92); border: 1px solid #4a4433;
        padding: 12px 16px 10px;
        /* A shopkeeper who is also a trainer has a great many things to say,
           and a panel that grows without a stop fills the glass — on a phone
           it reached the top of the screen and there was no world left to tap
           to get out of it.  The original's gossip frame scrolls; so does
           this. */
        max-height: min(58vh, 420px); overflow-y: auto;
        /* So the cap `place()` measures is the cap — see `#sheet`. */
        box-sizing: border-box;
      }
      /* The paperdoll: a picture of the character wearing what he is
         wearing, composed from the layer sheets in `public/art/doll/`. */
      /* The panel is sized off `FrameXML`'s character frame, and a picture
         added to it has to fit inside that rather than push it over the log.
         Sixty-four pixels is the doll at its own scale and no more. */
      #sheet { max-height: min(70vh, 420px); overflow-y: auto; }
      /* Beside the title rather than above the rows: the panel's height is
         `FrameXML`'s and a picture that pushes it taller pushes it over the
         log underneath. */
      #sheet .doll { position: absolute; top: 6px; right: 10px; }
      /* The canvas sizes itself — `paintDoll` sets it — because it is only
         the cell while his hands are empty.  Held on a fixed 56 square, a
         sword made the canvas 156 by 150 and the man was squashed sideways
         to make room for it. */
      #sheet { position: fixed; }
      #sheet .doll canvas { image-rendering: pixelated; }
      /* The screen that makes a character.  Every size in it is the client's
         — see `CREATE` in `pipeline/layout.py` — and what is written here is
         only how the groups sit, which that file's anchors cannot say. */
      #create {
        position: fixed; inset: 0; z-index: 20; pointer-events: auto;
        display: flex; align-items: center; justify-content: center;
        background: rgba(6, 7, 10, .88);
        font: var(--font-med)/1.6 var(--body); color: var(--ink);
      }
      /* `display: flex` above beats the `hidden` attribute's UA rule, so
         without this the screen stayed a full-screen layer with
         `pointer-events: auto` over the whole game after it was closed —
         every touch went to it and the stick never moved. */
      #create[hidden] { display: none; }
      #create .stage {
        background: var(--panel); border: 1px solid var(--gold-dark);
        border-radius: 5px; padding: 14px 18px 12px;
        box-shadow: inset 0 0 0 1px #000, 0 6px 24px rgba(0,0,0,.7);
        max-height: calc(100vh - 24px); overflow-y: auto;
      }
      #create .title {
        color: var(--gold); font: var(--font-small)/1.8 var(--mono);
        letter-spacing: .04em; text-align: center;
        border-bottom: 1px solid var(--gold-dark);
        padding-bottom: 5px; margin-bottom: 10px;
      }
      #create .cols { display: flex; gap: 18px; align-items: flex-start; }
      /* A box only where it has to be one — see `createPane`. */
      #create .pane { display: contents; }
      #create .seen {
        border: 1px solid var(--gold-dark); border-radius: 3px;
        background: rgba(0,0,0,.35); padding: 6px; line-height: 0;
      }
      #create .seen canvas { image-rendering: pixelated; }
      #create .right { display: flex; flex-direction: column; gap: 10px; }
      #create .group { display: flex; }
      /* The races go down a list the client sizes at 220 by 220 and scrolls —
         that is what a `<ScrollFrame>` is.  Ten of them at 38 with a 21 gap do
         not fit in 220, in the original either. */
      #create .races { flex-direction: column; overflow-y: auto; }
      #create .sexes, #create .classes, #create .looks { flex-wrap: wrap; }
      #create .pick {
        display: flex; flex-direction: column; justify-content: center;
        background: rgba(201,168,106,.08); border: 1px solid var(--gold-dark);
        border-radius: 3px; color: var(--ink); font: inherit;
        padding: 0 8px; cursor: pointer; text-align: left;
        /* A flex item shrinks by default, and these are in a column under a
           `max-height`: left to shrink, a 38-pixel race button came out 21. */
        flex: 0 0 auto;
      }
      #create .pick:hover { background: rgba(201,168,106,.18); }
      #create .pick.on { border-color: var(--gold); color: var(--gold); }
      #create .pick.off { opacity: .38; cursor: default; }
      #create .pick .why {
        font: var(--font-tiny)/1.2 var(--mono); color: #8a8f9e;
      }
      #create .name {
        background: rgba(0,0,0,.4); border: 1px solid var(--gold-dark);
        border-radius: 3px; color: var(--ink); font: inherit; padding: 0 8px;
        box-sizing: border-box;
      }
      #create .foot {
        display: flex; align-items: center; gap: 10px;
        margin-top: 12px; padding-top: 8px;
        border-top: 1px solid var(--gold-dark);
      }
      #create .say { flex: 1; color: #9aa; font: var(--font-small)/1.5 var(--mono); }
      #create .ok, #create .dice {
        background: rgba(201,168,106,.12); border: 1px solid var(--gold-dark);
        border-radius: 3px; color: var(--ink); font: inherit; cursor: pointer;
      }
      #create .ok:disabled { opacity: .35; cursor: default; }
      #create .ok:hover:enabled, #create .dice:hover {
        background: rgba(201,168,106,.24);
      }
      /* **Forty-four, because a finger is not a mouse.**  The sizes on this
         screen are the client's own out of `CharacterCreate.xml` and on a
         phone they come out 38 — all thirty-nine of them.  Forty-four is what
         both phone platforms publish and it is the floor `padcheck` already
         holds the game's own controls to; this screen was never asked, because
         it happens before the game starts.  A `min-height` rather than a
         height, so it clamps the inline number the client's value sets. */
      body.touch #create .pick,
      body.touch #create .ok,
      body.touch #create .dice,
      body.touch #create .name { min-height: 44px; }
      body.touch #create .cols { flex-direction: column; gap: 10px; }
      body.touch #create .stage { width: calc(100vw - 20px); }
      body.touch #create .races { flex-direction: row; flex-wrap: wrap; }
      /* **The preview does not scroll away.**  It is 410 pixels of the top of
         a 844-pixel screen and it went up with everything else, so by the time
         you were choosing a beard you could not see what a beard did. */
      body.touch #create .seen {
        position: sticky; top: 0; z-index: 1; background: #14110e;
      }
      /* And the name and the button into the world stay on the glass, so
         neither of them is something you have to scroll back to. */
      body.touch #create .foot {
        position: sticky; bottom: 0; z-index: 2;
        /* Opaque, not the panel's own translucent fill: the buttons it is
           meant to stay in front of were reading straight through it. */
        background: #14110e; margin-top: 8px; padding-bottom: 2px;
      }
      /* The line that says what you have chosen is a hint, and on a phone it
         was three characters wide and four lines tall beside the buttons. */
      body.touch #create .say { flex: 1 1 0; min-width: 0; font-size: 11px; }
      /* **Lying down, it is two columns**, which is the whole of this.
         844 x 390 is twice the width and half the height, and a single column
         used the new width for nothing and lost the height twice over: three
         of thirty-nine buttons were on the glass.  The preview takes the left,
         the choosing takes the right and scrolls on its own — which is also
         the shape the original has, a character in the middle and the choices
         round the edge. */
      body.touch.lying #create .stage {
        width: calc(100vw - 16px); max-height: calc(100vh - 16px);
        padding: 8px 10px; overflow: hidden;
        display: flex; flex-direction: column;
      }
      body.touch.lying #create .cols {
        flex-direction: row; gap: 10px; align-items: stretch;
        flex: 1; min-height: 0;
      }
      body.touch.lying #create .seen {
        position: static; flex: 0 0 auto; align-self: flex-start;
      }
      /* The two groups that were siblings of the preview become one scrolling
         pane beside it.  `display: contents` cannot be used — the pane has to
         be a box for the scrolling to happen in. */
      body.touch.lying #create .races,
      body.touch.lying #create .right { max-height: none; }
      body.touch.lying #create .pane {
        flex: 1; min-width: 0; overflow-y: auto;
        display: flex; flex-direction: column; gap: 8px;
      }
      /* A flex item shrinks by default and these are wrapped rows inside a
         column: left to shrink, the whole race row came out nought pixels
         tall and simply was not there.  The same trap `#create .pick` already
         carries a note about. */
      body.touch.lying #create .pane > * { flex: 0 0 auto; }
      body.touch.lying #create .title { margin-bottom: 6px; }
      body.touch.lying #create .foot { position: static; margin-top: 6px; }

      /* The screen that chooses one.  Its sizes are the client's — a row is
         256 by 70 and the list is 260 wide — so what is here is only what a
         row is made of: three lines, which is what the original's own
         template holds. */
      #pick {
        position: fixed; inset: 0; z-index: 21; pointer-events: auto;
        display: flex; align-items: center; justify-content: center;
        background: rgba(6, 7, 10, .88);
        font: var(--font-med)/1.6 var(--body); color: var(--ink);
      }
      /* The same rule `#create` needs and for the same reason: `display:flex`
         beats the `hidden` attribute, and a full-screen layer with
         `pointer-events: auto` over the game eats every touch. */
      #pick[hidden] { display: none; }
      #pick .stage {
        background: var(--panel); border: 1px solid var(--gold-dark);
        border-radius: 5px; padding: 14px 18px 12px;
        box-shadow: inset 0 0 0 1px #000, 0 6px 24px rgba(0,0,0,.7);
        max-height: calc(100vh - 24px); overflow-y: auto;
      }
      #pick .title {
        color: var(--gold); font: var(--font-small)/1.8 var(--mono);
        letter-spacing: .04em; text-align: center;
        border-bottom: 1px solid var(--gold-dark);
        padding-bottom: 5px; margin-bottom: 10px;
      }
      #pick .list {
        display: flex; flex-direction: column; gap: 6px;
        overflow-y: auto; max-width: calc(100vw - 60px);
      }
      #pick .card {
        display: flex; flex-direction: column; justify-content: center;
        background: rgba(201,168,106,.08); border: 1px solid var(--gold-dark);
        border-radius: 3px; color: var(--ink); font: inherit;
        padding: 0 10px; cursor: pointer; text-align: left;
        flex: 0 0 auto;
      }
      #pick .card:hover { background: rgba(201,168,106,.18); }
      #pick .card.on {
        border-color: var(--gold); background: rgba(201,168,106,.22);
      }
      #pick .card.off { opacity: .45; }
      #pick .card .who { color: var(--gold); font: var(--font-med)/1.4 var(--body); }
      #pick .card .what,
      #pick .card .where {
        font: var(--font-tiny)/1.3 var(--mono); color: #9aa;
      }
      #pick .card.off .where { color: #c98; }
      #pick .empty { color: #8a8f9e; font: var(--font-small)/2 var(--mono); }
      #pick .foot {
        display: flex; align-items: center; gap: 10px;
        margin-top: 12px; padding-top: 8px;
        border-top: 1px solid var(--gold-dark);
      }
      #pick .say { flex: 1; color: #9aa; font: var(--font-small)/1.5 var(--mono); }
      #pick .ok, #pick .dice, #pick .erase {
        background: rgba(201,168,106,.12); border: 1px solid var(--gold-dark);
        border-radius: 3px; color: var(--ink); font: inherit; cursor: pointer;
        padding: 0 10px;
      }
      #pick .ok:disabled, #pick .dice:disabled, #pick .erase:disabled {
        opacity: .35; cursor: default;
      }
      #pick .ok:hover:enabled, #pick .dice:hover:enabled,
      #pick .erase:hover:enabled { background: rgba(201,168,106,.24); }
      body.touch #pick .stage { width: calc(100vw - 20px); }

      /* The shop.  Its box comes from `MerchantFrame` — 384 by 512 in the
         gossip window's corner — so what is written here is only what a row
         is made of.  Ten rows to a page, which is `MERCHANT_ITEMS_PER_PAGE`,
         and page buttons because our own stock needs them: 78 vendors fit on
         one page and 12 do not. */
      #shop, #book {
        position: fixed; z-index: 6; box-sizing: border-box;
        padding: 8px 10px 6px; display: flex; flex-direction: column;
        font: var(--font-small)/1.5 var(--mono);
      }
      #shop ul, #book ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
      #shop li, #book li {
        display: flex; align-items: center; gap: 6px; cursor: pointer;
        /* 44 is `MerchantItemTemplate`'s own height — a row of that window. */
        min-height: 26px; padding: 2px 4px; border-radius: 3px;
      }
      #shop li:hover, #book li:hover { background: rgba(201,168,106,.12); }
      #shop li.poor, #book li.poor { opacity: .45; cursor: default; }
      #shop li.empty, #book li.empty { justify-content: center; color: #8a8f9e; cursor: default; }
      #shop .what, #book .what { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
      #shop .name, #book .name { display: flex; flex-direction: column; min-width: 0; }
      #shop .does, #book .does {
        font: var(--font-tiny)/1.3 var(--mono); color: #8a8f9e;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #shop .price { color: var(--gold); white-space: nowrap; }
      #shop .foot, #book .foot {
        display: flex; align-items: center; gap: 8px;
        margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--gold-dark);
      }
      /* The purse goes bottom right, which is `MerchantMoneyFrame`. */
      #shop .purse { margin-left: auto; color: var(--gold); }
      #shop .page, #book .page {
        background: rgba(201,168,106,.1); border: 1px solid var(--gold-dark);
        color: var(--ink);
        border-radius: 3px; cursor: pointer; font: inherit; padding: 0 6px;
      }
      #shop .page:disabled { opacity: .35; cursor: default; }
      #shop .which, #book .which { color: #8a8f9e; }
      /* The book is two columns of six, which is what `SpellBookFrame.xml`
         says: button 2 sits 157 to the right of button 1 and button 3 sits
         under it.  A drag out of here is how a thing gets on to the bar. */
      #book ul {
        display: grid; grid-template-columns: 1fr 1fr;
        grid-auto-rows: min-content; gap: 4px 10px; align-content: start;
      }
      #book li { cursor: grab; }
      #book li:active { cursor: grabbing; }
      #talk .who { color: #c9a86a; font: var(--font-small)/1.5 var(--mono); letter-spacing: .02em; }
      #talk .say { margin: 6px 0 10px; }
      #talk ol { margin: 0; padding: 0; list-style: none; }
      #talk li { cursor: pointer; padding: 2px 0; color: #9fc6e0; }
      #talk li:hover { color: #d8ecff; }
      #talk li b { color: #6f8ea6; font: var(--font-small) var(--mono); margin-right: 8px; }
      /*
        The picture on a row that is a thing rather than a sentence.

        A mask and not an `<img>`, because the icons are cut white on
        transparent on purpose — masked, one file paints in whatever colour
        the quality asks for, where tinting an `<img>` means either a filter
        chain that only approximates a colour or one copy of the file per
        colour.
      */
      .pic {
        display: inline-block; width: 1.15em; height: 1.15em;
        vertical-align: -0.2em; margin-right: 6px;
        background: currentColor;
        -webkit-mask: var(--pic) center/contain no-repeat;
        mask: var(--pic) center/contain no-repeat;
      }
      #bag li .pic, #sheet .pic { margin-right: 8px; }
      #talk .lines { color: #e8e4d8; padding: 2px 0 6px 26px; }
      #talk .foot { margin-top: 8px; color: #6b6658; font: var(--font-tiny)/1.5 var(--mono); }

      /*
        The phone.  `body.touch` is set by the scene once it knows, rather than
        by a media query alone: a laptop with a touchscreen answers `pointer:
        coarse` and is still a keyboard until somebody touches it.

        **Where things go on a phone is not here.**  It is `placePhone` in
        `src/hud.ts`, because the two corners that matter are the stick and
        the button cluster, and those are drawn on the canvas out of
        `layoutFor` — a number no stylesheet can ask for.  Rules that tried
        stood in this file for weeks and never applied: `#micro` has no
        `position`, so `top: 152px` on it was decoration, and the menu came
        out as five full-width rows across the top half of the screen.

        What is left here is what a phone changes about *size and look*: a
        readout sixty monospace columns wide does not fit in 390, a 46-pixel
        portrait is a quarter of the width, and a conversation option is a
        20-pixel line of text where a finger needs forty.
      */
      /* The readout was nine, and nine is under the floor.
         The phone's type is the client's own ladder one rung up and its
         bottom rung is eleven — which is where the wiki measured Hangul
         starting to fall back to a substitute face.  This panel carries
         Korean keys (`대상`, `분노`) like everything else, so "it is only a
         developer's readout" does not buy it an exemption: it is on the
         screen and it is read.  Issue 203. */
      body.touch #hud { font-size: var(--font-tiny); padding: 6px 8px; }
      /* A phone's bottom row is two thumbs, so the bar is not there — the
         touch buttons are the action bar, and they already are. */
      body.touch #bar { display: none; }
      /* Smaller, and gathered: five of these share 116 pixels of the right
         edge above the cluster, two to a row. */
      /* Two wide against the right edge standing up, one row along the top
         edge lying down — `placePhone` says which by putting `lying` on the
         body, because an inline style would beat the rule below that takes
         this away while somebody is talking. */
      /* The map is a button on a phone: pressing it is what brings the five
         out.  The original's own `MinimapCluster` carries buttons for the same
         reason.  Not on a desktop, where the micro row lives on the action bar
         and a click on the map belongs to the world behind it. */
      body.touch #map { pointer-events: auto; cursor: pointer; }
      body.touch #micro {
        display: grid; grid-template-columns: repeat(2, 1fr);
        gap: 3px; padding-bottom: 0;
      }
      body.touch.lying #micro { display: flex; }
      body.touch #micro button { font-size: var(--font-tiny); padding: 5px 2px; }
      /* On a phone the backpack is a sheet, like the character panel and the
         map: the corner it used to take is the attack button. */
      body.touch #bag {
        left: 50%; top: 50%; right: auto; bottom: auto;
        transform: translate(-50%, -50%);
        width: min(260px, calc(100vw - 32px)); font-size: var(--font-small);
      }
      /* A pinned width is a width.  Without this the strips under the player
         came out two pixels wider than the frame above them, which on a
         390-pixel screen is a visible step. */
      body.touch #units, body.touch #log, body.touch #micro, body.touch #map,
      body.touch #track, body.touch #ui #xp, body.touch #ui #swing {
        box-sizing: border-box;
      }
      body.touch #world canvas { height: auto; width: calc(100vw - 44px); }
      body.touch #map canvas { border-width: 2px; margin: 0 auto; }
      /* The plates take the whole box: inset by 14 on a 118-pixel one there
         is no room left for a place name. */
      body.touch #map .where, body.touch #map .clock { margin: 0; }
      body.touch #log { font-size: var(--font-tiny); }
      body.touch #track { font-size: var(--font-tiny); }
      body.touch #tip { display: none; }
      body.touch .frame { grid-template-columns: 30px 1fr; padding: 4px; }
      body.touch .frame .face { width: 30px; height: 30px; }
      body.touch .frame .top { font-size: var(--font-small); }
      body.touch .frame .bar, body.touch #ui #xp { height: 12px; }
      body.touch .frame .num, body.touch #ui #xp .num { line-height: 12px; }
      /* The old game's own frame, which had no portrait in it: a name, a life
         bar, a resource bar and its marks.  116 by 40 is three lines of type
         and a face in it leaves no room for the first of them, and the face is
         not lost — the character sheet composites the whole paperdoll two
         panels away.  `placePhone` sets the class and the size; what a frame
         is *made of* is a shape and belongs here. */
      #units.lean .frame {
        grid-template-columns: 1fr; gap: 0; padding: 3px 4px;
        /* The height `placePhone` sets is the frame, not the frame plus its
           padding and its rim: without this the 2.9 : 1 it asks for comes out
           2.4 and reads as a different frame. */
        box-sizing: border-box; margin-bottom: 4px; align-content: center;
      }
      #units.lean .frame .face { display: none; }
      #units.lean .frame .top { font-size: var(--font-tiny); line-height: 1.15; }
      #units.lean .frame .bar { height: 8px; margin-top: 2px; }
      #units.lean .frame .num { font-size: 8px; line-height: 8px; }
      #units.lean .rage { height: 5px; margin-top: 2px; }
      #units.lean .rage .num { display: none; }
      /* No plate: it sits over the grass between the map and the world, and a
         box there reads as another panel rather than as a hint. */
      body.touch #help {
        font-size: var(--font-tiny); background: none; padding: 0;
        text-shadow: 0 1px 3px #000, 0 0 4px #000;
      }
      /* A conversation takes the phone.  Everything that takes a press and is
         not an answer goes away for as long as it is open — see `setBusy` in
         `src/touch.ts`, which does the same for the stick and the buttons. */
      body.touch.talking #micro { display: none; }
      /* Nearly opaque: at .92 the panel covers half a phone and the world
         ghosts through all of it. */
      /* The size comes from the ladder now — see `spell` — and the place from
         `placePhone`, which puts it down the left the way `GossipFrame` is.
         What is left here is the one thing the client does not say: how opaque
         a panel with a game behind it should be. */
      body.touch #talk { font-size: var(--font-med); background: rgba(10,12,18,.975); }
      body.touch #talk li { padding: 11px 0; }
      body.touch #talk li b { font-size: var(--font-med); }
      body.touch #talk .lines { padding: 0 0 10px 26px; }
    </style>
    <!-- Installable, because closing the tab is how a session ends here: the
         save lives in IndexedDB and the world is a file, so there is nothing
         about this game that needs a network on the second visit.  The icon
         is the same game-icons.net blade the attack button uses, rendered by
         `npm run icons`; `art/UI-CREDITS.md` names its author. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="art/icon/abyss-192.png" />
    <meta name="theme-color" content="#14161f" />
  </head>
  <body>
    <div id="hud" class="plain" hidden>불러오는 중…</div>
    <div id="help">WASD: 이동  E: 대화·줍기  B: 가방  P: 주문서  T: 제작  Y: 자동  C: 정보  M: 지도  `: 수치</div>
    <div id="talk" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
