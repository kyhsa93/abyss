<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Abyss — Raid Prototype</title>
    <meta name="description" content="A browser raid encounter fought alongside AI party members." />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Abyss" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* Stop pull-to-refresh and rubber-banding from fighting the joystick. */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: #0a0a0f;
        color: #cbd5e1;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="stage"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
