<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyss</title>
    <meta name="description" content="WoW 클라이언트에서 읽어낸 엘윈 숲을, 우리 것인 그림으로 그린다." />
    <meta name="theme-color" content="#93b6cf" />
    <style>
      /*
        Korean first in both stacks.  A Latin-first stack is not wrong so much
        as invisible: the browser falls through to whatever it has for Hangul,
        which on Linux is whichever one was installed first.
      */
      :root {
        --mono: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR',
          ui-monospace, monospace;
        --body: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR',
          system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden; }
      canvas { display: block; touch-action: none; }
      html { overscroll-behavior: none; }
      /*
        The readout is a grid, not padded text: a Korean glyph is two columns
        wide where a Latin one is one, and the font a phone falls back to for
        Korean is not monospace at all, so nothing lines up by counting spaces.
      */
      #hud {
        position: fixed; left: 8px; top: 8px; color: #cfe;
        font: 12px/1.5 var(--mono); background: rgba(0,0,0,.55); padding: 8px 10px;
        white-space: pre; pointer-events: none;
        display: grid; grid-template-columns: max-content auto; gap: 0 14px;
      }
      #hud .k { color: #8aa8bb; }
      #hud.plain { display: block; }
      #help {
        position: fixed; right: 8px; bottom: 8px; color: #9ab; font: 11px/1.6 var(--mono);
        background: rgba(0,0,0,.55); padding: 6px 8px; white-space: pre; pointer-events: none;
      }
      /*
        The interface, as opposed to the readout above it.  Two unit frames and
        a bar of actions: the shape the game this is modelled on settled on,
        and the reason it reads at a glance.
      */
      /* Nothing in here takes a click: the interface reports, and the world
         underneath it is what answers a finger. */
      #ui, #ui * { pointer-events: none; }
      /* Except the two things that are controls rather than reports.  Written
         with the id in front of them because `#ui *` is more specific than a
         bare class and quietly won: the slots were set to `auto` and computed
         to `none`. */
      #ui .slot, #ui #bag li, #ui #micro button, #ui .auras .aura {
        pointer-events: auto; cursor: pointer;
      }
      /* Above the canvas, said out loud.  Both are painted in the positioned
         layer and the canvas is the later sibling, so without this the two
         controls that take a click — an action slot and a bag row — were
         behind the world. */
      #ui { position: fixed; inset: 0; color: #e8e4d8; z-index: 2; }
      #units { position: absolute; left: 10px; top: 10px; width: 232px; }
      .frame {
        display: grid; grid-template-columns: 40px 1fr; gap: 8px;
        background: rgba(12,14,20,.82); border: 1px solid #4a4433;
        padding: 6px; margin-bottom: 6px;
      }
      /* A `display` of its own beats the browser's `[hidden] { display: none }`,
         so the target frame stayed on the screen as an empty box the moment
         there was nothing to target. */
      .frame[hidden] { display: none; }
      .frame .face {
        width: 40px; height: 40px; opacity: .85;
        background: rgba(255,255,255,.06); border: 1px solid #3b3a34;
      }
      .frame .top {
        display: flex; justify-content: space-between; align-items: baseline;
        font: 12px/1.3 var(--body);
      }
      .frame .name { color: #e8e4d8; }
      .frame .lv { color: #c9a86a; font: 11px var(--mono); }
      .frame .bar, #ui .xp {
        position: relative; height: 15px; margin-top: 5px;
        background: rgba(0,0,0,.55); border: 1px solid #2c2a24; overflow: hidden;
      }
      .frame .fill, #ui .xp .fill {
        position: absolute; inset: 0 auto 0 0; width: 0;
        transition: width .12s linear;
      }
      .frame .num, #ui .xp .num {
        position: relative; display: block; text-align: center;
        font: 10px/15px var(--mono); color: #eef; text-shadow: 0 1px 1px #000;
      }
      #ui .xp { height: 9px; margin: 2px 0 0; }
      #ui .xp .fill { background: #6a4fb0; }
      #ui .xp .num { font-size: 9px; line-height: 9px; color: #cfc6ea; }

      /* The minimap.  Square and not round: a circular mask throws away the
         corners of something that was expensive to sample, and a square one
         says plainly that it is a piece of the map. */
      #map {
        position: absolute; right: 10px; top: 10px;
        border: 1px solid #4a4433; background: rgba(12,14,20,.85); padding: 3px;
      }
      #map canvas { display: block; image-rendering: pixelated; }
      #map .clock {
        text-align: center; font: 10px/1.5 var(--mono); color: #8aa8bb;
      }
      #map .where {
        text-align: center; font: 10px/1.7 var(--mono); color: #c9a86a;
        border-top: 1px solid #3b382e; margin-top: 3px;
      }

      /* What just happened, newest last. */
      #log {
        position: absolute; left: 10px; bottom: 12px; width: 300px;
        font: 11px/1.55 var(--body); text-shadow: 0 1px 2px #000;
      }
      #log div { color: #b9c4cc; }
      #log .hit { color: #ffe9a8; }
      #log .hurt { color: #ff9d8c; }
      #log .gain { color: #a9e39a; }

      #sheet {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        min-width: 230px; background: rgba(12,14,20,.94); border: 1px solid #4a4433;
        padding: 10px 14px; font: 12px/1.8 var(--body);
      }
      #sheet[hidden] { display: none; }
      #sheet .title {
        color: #c9a86a; font: 11px/1.8 var(--mono);
        border-bottom: 1px solid #3b382e; margin-bottom: 5px;
      }
      #sheet .row { display: flex; justify-content: space-between; gap: 20px; }
      #sheet .k { color: #8aa8bb; }

      #tip {
        position: absolute; max-width: 230px;
        background: rgba(8,10,14,.96); border: 1px solid #4a4433;
        padding: 5px 8px; font: 11px/1.6 var(--body); color: #e8e4d8;
        white-space: pre-line; transform: translate(-50%, -100%);
      }
      #tip[hidden] { display: none; }

      #bag {
        position: absolute; right: 10px; bottom: 68px; width: 190px;
        background: rgba(12,14,20,.92); border: 1px solid #4a4433; padding: 8px 10px;
        font: 12px/1.7 var(--body);
      }
      #bag .title {
        color: #c9a86a; font: 11px/1.6 var(--mono); border-bottom: 1px solid #3b382e;
        padding-bottom: 4px; margin-bottom: 4px;
      }
      #bag ul { margin: 0; padding: 0; list-style: none; }
      #bag li { display: flex; justify-content: space-between; }
      #bag li.empty { color: #6b6658; justify-content: center; }
      #bag .many { color: #9ab; font: 11px var(--mono); }
      #bag[hidden] { display: none; }

      /* Twelve, always, and most of them empty — which is what this bar looks
         like before anybody has learned anything. */
      #bar {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; gap: 4px;
      }
      /* Empty, not see-through.  At half opacity the world showed through the
         squares and the bar read as broken rather than as unfilled. */
      .slot.bare { background: rgba(18,20,26,.9); border-color: #33302a; }
      .slot.bare .key { color: #6b6658; }

      /* What opens, as opposed to what you do. */
      /* A column up the corner: the help line sits on the floor, the buttons
         above it, and anything they open above those.  All three were at the
         bottom right and all three were on top of each other. */
      #micro {
        position: absolute; right: 10px; bottom: 34px; display: flex; gap: 4px;
      }
      #micro button {
        font: 11px var(--body); color: #9ab; background: rgba(12,14,20,.85);
        border: 1px solid #4a4433; padding: 5px 9px; cursor: pointer;
      }
      #micro button.on { color: #ffe9a8; border-color: #c9a86a; }

      #ui .rage {
        position: relative; height: 11px; margin: 2px 0 0;
        background: rgba(0,0,0,.55); border: 1px solid #2c2a24; overflow: hidden;
      }
      #ui .rage .fill {
        position: absolute; inset: 0 auto 0 0; width: 0; background: #b8402f;
        transition: width .1s linear;
      }
      #ui .rage .num {
        position: relative; display: block; text-align: center;
        font: 9px/11px var(--mono); color: #ffd9d0; text-shadow: 0 1px 1px #000;
      }

      #ui .auras { display: flex; gap: 3px; margin: 3px 0 0; }
      #ui .auras .aura {
        position: relative; width: 22px; height: 22px;
        background: rgba(12,14,20,.85); border: 1px solid #4a4433;
      }
      #ui .auras .aura img { width: 100%; height: 100%; }
      #ui .auras .aura span {
        position: absolute; right: 1px; bottom: 0;
        font: 9px var(--mono); color: #ffe9a8; text-shadow: 0 1px 2px #000;
      }

      /* The swing, which is the only timer there is. */
      #ui .swing {
        height: 4px; margin: -2px 0 0; background: rgba(0,0,0,.5);
        border: 1px solid #2c2a24; border-top: 0; overflow: hidden;
      }
      #ui .swing .fill { height: 100%; width: 0; background: #c9a86a; }

      #ui .oftarget {
        margin: 2px 0 2px 48px; font: 10px/1.5 var(--mono); color: #8aa8bb;
      }
      #ui .oftarget[hidden] { display: none; }
      .slot {
        position: relative; width: 46px; height: 46px;
        background: rgba(12,14,20,.85); border: 1px solid #4a4433;
      }
      /* Not on the slot: `overflow: hidden` there clipped the label off the
         bottom, which is where a label under a square lives. */
      .slot img, .slot .sweep { position: absolute; inset: 0; }
      .slot img { width: 100%; height: 100%; opacity: .35; }
      .slot.live img { opacity: .95; }
      /* The swing, drawn as a shutter that falls rather than a number. */
      .slot .sweep {
        position: absolute; inset: 0; background: rgba(0,0,0,.6);
        transform-origin: top; transform: scaleY(0);
      }
      .slot .key {
        position: absolute; left: 3px; top: 1px;
        font: 10px var(--mono); color: #c9a86a;
      }
      /* Under the square, not over it: the label sat on the icon and the two
         were unreadable together. */
      .slot .name {
        position: absolute; left: 0; right: 0; bottom: -15px; text-align: center;
        font: 10px var(--body); color: #9ab; text-shadow: 0 1px 2px #000;
      }
      /* The minimap.  Square and not round: a circular mask throws away the
         corners of something that was expensive to sample, and a square one
         says plainly that it is a piece of the map. */
      #map {
        position: absolute; right: 10px; top: 10px;
        border: 1px solid #4a4433; background: rgba(12,14,20,.85); padding: 3px;
      }
      #map canvas { display: block; image-rendering: pixelated; }
      #map .clock {
        text-align: center; font: 10px/1.5 var(--mono); color: #8aa8bb;
      }
      #map .where {
        text-align: center; font: 10px/1.7 var(--mono); color: #c9a86a;
        border-top: 1px solid #3b382e; margin-top: 3px;
      }

      /* What just happened, newest last. */
      #log {
        position: absolute; left: 10px; bottom: 12px; width: 300px;
        font: 11px/1.55 var(--body); text-shadow: 0 1px 2px #000;
      }
      #log div { color: #b9c4cc; }
      #log .hit { color: #ffe9a8; }
      #log .hurt { color: #ff9d8c; }
      #log .gain { color: #a9e39a; }

      #sheet {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        min-width: 230px; background: rgba(12,14,20,.94); border: 1px solid #4a4433;
        padding: 10px 14px; font: 12px/1.8 var(--body);
      }
      #sheet[hidden] { display: none; }
      #sheet .title {
        color: #c9a86a; font: 11px/1.8 var(--mono);
        border-bottom: 1px solid #3b382e; margin-bottom: 5px;
      }
      #sheet .row { display: flex; justify-content: space-between; gap: 20px; }
      #sheet .k { color: #8aa8bb; }

      #tip {
        position: absolute; max-width: 230px;
        background: rgba(8,10,14,.96); border: 1px solid #4a4433;
        padding: 5px 8px; font: 11px/1.6 var(--body); color: #e8e4d8;
        white-space: pre-line; transform: translate(-50%, -100%);
      }
      #tip[hidden] { display: none; }

      #bag {
        position: absolute; right: 10px; bottom: 68px; width: 190px;
        background: rgba(12,14,20,.92); border: 1px solid #4a4433; padding: 8px 10px;
        font: 12px/1.7 var(--body);
      }
      #bag .title {
        color: #c9a86a; font: 11px/1.6 var(--mono); border-bottom: 1px solid #3b382e;
        padding-bottom: 4px; margin-bottom: 4px;
      }
      #bag ul { margin: 0; padding: 0; list-style: none; }
      #bag li { display: flex; justify-content: space-between; }
      #bag li.empty { color: #6b6658; justify-content: center; }
      #bag .many { color: #9ab; font: 11px var(--mono); }
      #bag[hidden] { display: none; }

      #bar { bottom: 30px; }

      /* The readout is a developer's, so it goes where one belongs and starts
         out of the way.  ` shows it. */
      #hud { left: auto; right: 8px; }
      #hud[hidden] { display: none; }

      #talk {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        width: min(620px, calc(100vw - 32px)); color: #e8e4d8;
        font: 13px/1.75 var(--body);
        background: rgba(12,14,20,.92); border: 1px solid #4a4433;
        padding: 12px 16px 10px;
      }
      #talk .who { color: #c9a86a; font: 11px/1.5 var(--mono); letter-spacing: .02em; }
      #talk .say { margin: 6px 0 10px; }
      #talk ol { margin: 0; padding: 0; list-style: none; }
      #talk li { cursor: pointer; padding: 2px 0; color: #9fc6e0; }
      #talk li:hover { color: #d8ecff; }
      #talk li b { color: #6f8ea6; font: 11px var(--mono); margin-right: 8px; }
      #talk .lines { color: #e8e4d8; padding: 2px 0 6px 26px; }
      #talk .foot { margin-top: 8px; color: #6b6658; font: 10px/1.5 var(--mono); }

      /*
        The phone.  `body.touch` is set by the scene once it knows, rather than
        by a media query alone: a laptop with a touchscreen answers `pointer:
        coarse` and is still a keyboard until somebody touches it.

        Three things move.  The readout is sixty monospace columns wide and a
        390-pixel phone is not, so it shrinks.  The help line lives in the
        bottom right corner, which on touch is where the buttons are — and the
        top is the readout and the bottom left is the stick, so what is left is
        the gap between the two thumbs, which is 160 pixels wide and wants two
        short lines rather than one long one.  And an option in a conversation
        is a 20-pixel line of text, which is half of what a finger can hit.
      */
      body.touch #hud { font-size: 9px; padding: 6px 8px; }
      /* A phone's bottom row is two thumbs, so the bar is not there — the
         touch buttons are the action bar, and they already are. */
      body.touch #bar { display: none; }
      /* Under the map, not over it: the map box is a 96-pixel canvas plus two
         lines of text, which is 156 and not 128. */
      body.touch #micro { bottom: auto; top: 158px; right: 8px; flex-direction: column; }
      body.touch #micro button { font-size: 10px; padding: 4px 6px; }
      body.touch #bag { bottom: 170px; width: 150px; font-size: 11px; }
      /* A phone's corners are the stick, the buttons and the readout, so the
         map shrinks and the log gets out of the stick's way. */
      body.touch #map canvas { width: 96px; height: 96px; }
      body.touch #log { bottom: auto; top: 120px; width: 160px; font-size: 10px; }
      body.touch #tip { display: none; }
      body.touch #units { width: 176px; }
      body.touch .frame { grid-template-columns: 30px 1fr; padding: 4px; }
      body.touch .frame .face { width: 30px; height: 30px; }
      body.touch #help {
        right: auto; left: 50%; transform: translateX(-50%);
        bottom: 10px; text-align: center; font-size: 10px;
      }
      /* Nearly opaque: at .92 the panel covers half a phone and the world
         ghosts through all of it. */
      body.touch #talk { bottom: 16px; font-size: 15px; background: rgba(10,12,18,.975); }
      body.touch #talk li { padding: 11px 0; }
      body.touch #talk li b { font-size: 13px; }
      body.touch #talk .lines { padding: 0 0 10px 26px; }
    </style>
  </head>
  <body>
    <div id="hud" class="plain" hidden>불러오는 중…</div>
    <div id="help">WASD: 이동   1: 공격   E: 대화·줍기   B: 가방   C: 정보   `: 수치</div>
    <div id="talk" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
