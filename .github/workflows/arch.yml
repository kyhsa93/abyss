name: Arch

# Does the sim give the same numbers on arm64 as on x64? (#350, after #313)
#
# `dungeoncheck` failed on an arm64 laptop at a tick that passed on x64 CI, and
# the hash of the sim's state had never been set side by side. This does it:
# `scripts/archprobe.ts` (seed 7, 2400 ticks, every party body's position, bit
# for bit) runs on a free hosted x64 runner and a free hosted arm64 one
# (macos-14), the two lines are compared, and `dungeoncheck` and `lawcheck`
# run on the arm64 runner as well.
#
# Kept apart from `deploy.yml` on purpose. It is not on push to main, so it
# adds nothing to the nineteen concurrent jobs of a Deploy (limit twenty) or to
# its wall clock; it runs when a pull request touches the sim or the probe, when
# somebody asks, and once a week. The Deploy `checks` job also prints the x64
# line on every push, for the record.
on:
  pull_request:
    paths: ['src/sim/**', 'src/dungeon.ts', 'src/dungeon/**', 'scripts/archprobe.ts', 'scripts/dungeoncheck.ts', 'scripts/lawcheck.ts', '.github/workflows/arch.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x64:
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.probe.outputs.line }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.x
          cache: npm
      - run: npm ci
      - id: probe
        run: |
          npm run archprobe | tee probe.txt
          echo "line=$(grep 'ARCHPROBE all' probe.txt | sed 's/^ARCHPROBE all [^ ]* node [^ ]* //')" >> "$GITHUB_OUTPUT"
          { echo '### x64'; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  arm64:
    runs-on: macos-14
    needs: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.x
          cache: npm
      - run: npm ci
      - name: Sim state hash (arm64) against x64
        run: |
          npm run archprobe | tee probe.txt
          arm="$(grep 'ARCHPROBE all' probe.txt | sed 's/^ARCHPROBE all [^ ]* node [^ ]* //')"
          x64="${{ needs.x64.outputs.line }}"
          # Two things are compared: the sim's walk, and the library maths alone.
          # They can part separately (the maths can differ where the sim never calls it).
          part() { echo "$1" | sed -E "s/.*$2 ([0-9a-f]+).*/\1/"; }
          [ "$(part "$arm" hash)" = "$(part "$x64" hash)" ] && sim=SAME || sim=DIFFERENT
          [ "$(part "$arm" math)" = "$(part "$x64" math)" ] && lib=SAME || lib=DIFFERENT
          line="ARCHPROBE verdict sim=$sim math=$lib | x64: $x64 | arm64: $arm"
          echo "$line"
          { echo '### arm64'; echo '```'; cat probe.txt; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The results are what is wanted here, so each runs even if the one
      # before it failed, and the job is red if any did.
      - name: dungeoncheck (arm64)
        if: always()
        run: npm run dungeoncheck
      - name: lawcheck (arm64)
        if: always()
        run: npm run lawcheck
